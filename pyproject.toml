[project]
name = "coffwe"
version = "0.1.0"
description = "Digital twin learning playground for COFFWE, an imaginary Western Ghats coffee estate — simulation, live IoT-style feed, and multi-agent AI brains."
readme = "README.md"
authors = [
    { email = "rajashanmuga54@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.5.1",
    "alembic>=1.20.1",
    "numpy>=2.5.5",
    "paho-mqtt>=2.2.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
coffwe = "coffwe:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Estate data tables read best as one record per line, even past 100 chars.
"src/coffwe/estate_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
