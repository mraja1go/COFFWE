[project]
name = "coffwe"
version = "0.1.0"
description = "Digital twin learning playground for COFFWE, an imaginary Western Ghats coffee estate — simulation, live IoT-style feed, and multi-agent AI brains."
readme = "README.md"
authors = [
    { email = "rajashanmuga54@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
coffwe = "coffwe:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
